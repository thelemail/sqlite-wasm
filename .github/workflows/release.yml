name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release tag
        env:
          TAG: ${{ github.ref_name }}
          FINGERPRINT: ${{ vars.RELEASE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "$FINGERPRINT" ]; then
            echo "RELEASE_SIGNING_FINGERPRINT is not set." >&2
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/${TAG}")" = tag
          gpg --import .github/release-signing-key.asc
          git verify-tag --raw "refs/tags/${TAG}" 2>&1 | grep -q "VALIDSIG ${FINGERPRINT}"
          test "v$(node -p 'require("./package.json").version')" = "$TAG"

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check the artifact against the pins
        run: |
          set -euo pipefail
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            const pins = JSON.parse(readFileSync("pins.json", "utf8")).output;
            for (const [name, hex] of Object.entries(pins)) {
              const actual = createHash("sha256").update(readFileSync("dist/" + name)).digest("hex");
              if (actual !== hex) { console.error(name, actual, hex); process.exit(1); }
            }
          '

      - run: npm publish --provenance --access public --tag latest
